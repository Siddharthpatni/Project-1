name: CI

on:
  push:
    branches: [main, siddharth-patni]
  pull_request:
    branches: [main, siddharth-patni]

# Cancel in-progress runs on the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimum permissions — principle of least privilege
permissions:
  contents: read
  security-events: write  # needed for CodeQL / trivy SARIF upload

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. Backend: install deps → run pytest
  # ─────────────────────────────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # psycopg[binary] needs these even for the binary wheel on Ubuntu
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpq-dev \
            curl \
            ca-certificates

      - name: Install Python dependencies (core + test)
        run: |
          cd backend
          pip install --upgrade pip wheel
          # Install everything except the heavy optional AI agent packages
          pip install \
            fastapi==0.115.0 \
            "uvicorn[standard]==0.32.0" \
            "pydantic>=2.9.2,<3.0" \
            "pydantic-settings>=2.5.2,<3.0" \
            sqlalchemy==2.0.35 \
            "psycopg[binary]==3.2.3" \
            alembic==1.13.3 \
            celery==5.4.0 \
            redis==5.1.1 \
            "httpx>=0.27.2,<1.0" \
            "openai>=1.51.0,<2.0" \
            "anthropic>=0.36.0,<1.0" \
            playwright==1.47.0 \
            lxml==5.3.0 \
            beautifulsoup4==4.12.3 \
            "requests>=2.32.3,<3.0" \
            boto3==1.35.36 \
            python-multipart==0.0.12 \
            "tenacity==9.0.0" \
            "structlog==24.4.0" \
            "rich>=13.9.2,<14.0" \
            pytest==8.3.3 \
            pytest-asyncio==0.24.0 \
            "pytest-json-report==1.5.0" \
            "pandas==2.2.3" \
            openpyxl==3.1.5 \
            maincontentextractor==0.0.4

      # Install heavy AI packages separately — failure here does NOT
      # block the test suite (orchestrator uses lazy imports)
      - name: Install AI agent packages (non-fatal)
        run: |
          cd backend
          pip install \
            "browser-use==0.12.7" \
            "langchain-openai>=0.1.0,<1.0" \
            "langchain-anthropic>=0.2.0,<1.0" || \
          echo "::warning::AI agent packages failed to install — CUA tests will be skipped"

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium --with-deps
        continue-on-error: true   # Playwright browser install can flake in CI

      - name: Run pytest
        env:
          DATABASE_URL: "sqlite:///./test_vergabepilot.db"
          OPENROUTER_API_KEY: ""          # blank → LLMClient returns stub
          S3_ENDPOINT: "http://localhost:9000"
          REDIS_URL: "redis://localhost:6379/0"
          LOG_LEVEL: "WARNING"            # reduce noise in CI output
        run: |
          cd backend
          python -m pytest tests/ \
            -v \
            --tb=short \
            --timeout=60 \
            -p no:warnings \
            --ignore=tests/test_phase2.py  # Phase 2 needs browser-use runtime

      # Run phase2 tests separately so a failure is clearly isolated
      - name: Run phase2 tests (action_space only)
        env:
          DATABASE_URL: "sqlite:///./test_vergabepilot.db"
        run: |
          cd backend
          python -m pytest tests/test_phase2.py -v --tb=short || \
          echo "::warning::Phase 2 tests failed — likely missing browser-use runtime"
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────
  # 2. Frontend: type-check → lint → build
  # ─────────────────────────────────────────────────────────────────
  frontend-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci --no-audit --prefer-offline

      - name: TypeScript type check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: ESLint
        run: |
          cd frontend
          npm run lint

      - name: Next.js build
        run: |
          cd frontend
          npm run build
        env:
          # Silence Next.js telemetry in CI
          NEXT_TELEMETRY_DISABLED: "1"

  # ─────────────────────────────────────────────────────────────────
  # 3. Security: dependency vulnerability scan (pip-audit + npm audit)
  # ─────────────────────────────────────────────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip-audit (Python dependency CVEs)
        run: |
          pip install pip-audit
          cd backend
          pip-audit -r requirements.txt --progress-spinner off || \
          echo "::warning::pip-audit found vulnerabilities — review before production"
        continue-on-error: true  # Report but don't block on upstream CVEs

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit (Node dependency CVEs)
        run: |
          cd frontend
          npm audit --audit-level=high || \
          echo "::warning::npm audit found high-severity vulnerabilities"
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────
  # 4. Docker: build all service images
  # ─────────────────────────────────────────────────────────────────
  container-build:
    runs-on: ubuntu-latest
    # Only run on push (not PR) to save CI minutes
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      # Enable BuildKit for faster, cacheable Docker builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: vergabepilot-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: vergabepilot-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
