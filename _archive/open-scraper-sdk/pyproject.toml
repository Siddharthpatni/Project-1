[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-scraper-sdk"
version = "0.1.0"
description = "A conceptual SDK for modern web scraping and LLM-powered structured extraction"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["scraping", "llm", "structured-data", "gemini", "sdk"]
authors = [
    { name = "Developer", email = "developer@example.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "requests>=2.28.0",
    "google-generativeai>=0.3.0",
    "pydantic>=2.0.0",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
]
