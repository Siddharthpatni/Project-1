services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vergabepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vergabepilot}
      POSTGRES_DB: ${POSTGRES_DB:-vergabepilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data

  api:
    build: 
      context: ./backend
      target: runner
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vergabepilot}:${POSTGRES_PASSWORD:-vergabepilot}@postgres:5432/${POSTGRES_DB:-vergabepilot}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    build: 
      context: ./backend
      target: runner
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vergabepilot}:${POSTGRES_PASSWORD:-vergabepilot}@postgres:5432/${POSTGRES_DB:-vergabepilot}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    depends_on:
      - api
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4

  beat:
    build: 
      context: ./backend
      target: runner
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vergabepilot}:${POSTGRES_PASSWORD:-vergabepilot}@postgres:5432/${POSTGRES_DB:-vergabepilot}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - worker
    command: celery -A app.workers.celery_app beat --loglevel=info

  frontend:
    build: 
      context: ./frontend
      target: runner
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000 # Use internal Docker network name
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
