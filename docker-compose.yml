# Vergabepilot.AI — full stack
#
# Scale architecture for 10,000+ URLs:
#
#   worker-default   : Job orchestration + evaluation tasks       concurrency=4
#   worker-chunks    : Per-chunk parallel URL processing (x2)     concurrency=16 each
#   worker-cua       : Computer-use agent (browser-heavy)         concurrency=2
#   beat             : Periodic tasks (versioning, crash-recovery)
#
# Total parallel URL capacity: 2 × 16 = 32 URLs simultaneously
# (Scale worker-chunks replicas or JOB_CONCURRENCY for more throughput)

x-worker-common: &worker-common
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:-vergabepilot}
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT: http://minio:9000
    SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
    VERGABEPILOT_ENV: ${VERGABEPILOT_ENV:-development}
    JOB_CONCURRENCY: ${JOB_CONCURRENCY:-8}
    JOB_CHUNK_SIZE: ${JOB_CHUNK_SIZE:-50}
    LLM_GLOBAL_CONCURRENCY: ${LLM_GLOBAL_CONCURRENCY:-8}
    DOMAIN_LLM_LOCK_TTL: ${DOMAIN_LLM_LOCK_TTL:-360}
    # Cascade feature flags (workers run the pipeline, so these matter here)
    ENABLE_FALLBACK_CUA: ${ENABLE_FALLBACK_CUA:-true}
    ENABLE_CUA_ROUTE_LEARNING: ${ENABLE_CUA_ROUTE_LEARNING:-true}
    ENABLE_ROUTE_LEARNING: ${ENABLE_ROUTE_LEARNING:-false}
    ANONYMIZED_TELEMETRY: "false"
    BROWSER_USE_LOGGING_LEVEL: "warning"
    # Ollama runs on the host (Metal GPU is unavailable inside containers);
    # host.docker.internal reaches it from any container.
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434/v1}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    - api
  volumes:
    - ./backend:/app
    - ./data:/app/data

services:
  # ── Infrastructure ────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-vergabepilot}
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=4MB
      -c idle_in_transaction_session_timeout=300000
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vergabepilot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # noeviction: Redis is the Celery broker + circuit-breaker state — with
    # allkeys-lru, memory pressure silently evicted queued jobs.
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --save ""
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API ───────────────────────────────────────────────────────────

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:-vergabepilot}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
      VERGABEPILOT_ENV: ${VERGABEPILOT_ENV:-development}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --timeout-keep-alive 75
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./backend:/app
      - ./data:/app/data

  # ── Celery Workers (tiered) ───────────────────────────────────────

  # Job orchestration: spawns chunk tasks, runs small jobs directly
  worker-default:
    <<: *worker-common
    command: >
      celery -A app.workers.celery_app worker
      --queues=default
      --concurrency=4
      --loglevel=info
      --hostname=worker-default@%h

  # Chunk workers: each handles ~50 URLs in parallel using asyncio
  # Scale replicas for more throughput: docker compose up --scale worker-chunks=4
  worker-chunks:
    <<: *worker-common
    command: >
      celery -A app.workers.celery_app worker
      --queues=chunks
      --concurrency=2
      --loglevel=info
      --hostname=worker-chunks@%h
    # Two replicas by default → 32 simultaneous URL slots
    deploy:
      replicas: 2

  # CUA worker: browser-heavy tasks, low concurrency to avoid RAM exhaustion
  worker-cua:
    <<: *worker-common
    command: >
      celery -A app.workers.celery_app worker
      --queues=cua
      --concurrency=2
      --loglevel=info
      --hostname=worker-cua@%h

  # ── Celery Beat ───────────────────────────────────────────────────

  beat:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:-vergabepilot}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
      VERGABEPILOT_ENV: ${VERGABEPILOT_ENV:-development}
    depends_on:
      - worker-default
    command: >
      celery -A app.workers.celery_app beat
      --loglevel=info
    volumes:
      - ./backend:/app

  # ── Frontend ──────────────────────────────────────────────────────

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      INTERNAL_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
