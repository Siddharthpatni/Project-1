version: "3.9"

# Vergabepilot.AI full stack
# - api       : FastAPI REST service
# - worker    : Celery worker for async scraping jobs
# - beat      : Celery beat for periodic document versioning checks
# - redis     : broker + result backend
# - postgres  : persistent metadata (jobs, scrapers, evaluation runs)
# - minio     : S3-compatible object storage for downloaded tender documents
# - frontend  : Next.js dashboard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vergabepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vergabepilot}
      POSTGRES_DB: ${POSTGRES_DB:-vergabepilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vergabepilot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vergabepilot}:${POSTGRES_PASSWORD:-vergabepilot}@postgres:5432/${POSTGRES_DB:-vergabepilot}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vergabepilot}:${POSTGRES_PASSWORD:-vergabepilot}@postgres:5432/${POSTGRES_DB:-vergabepilot}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    depends_on:
      - api
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./backend:/app

  beat:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vergabepilot}:${POSTGRES_PASSWORD:-vergabepilot}@postgres:5432/${POSTGRES_DB:-vergabepilot}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - worker
    command: celery -A app.workers.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
