# Vergabepilot.AI — production reverse proxy.
#
# One public origin for 100+ concurrent devices:
#   /                → Next.js frontend (SSR + static)
#   /api/…           → FastAPI backend (direct, bypasses the Next rewrite hop)
#   /docs /openapi…  → FastAPI docs
#   /health /metrics → FastAPI probes (metrics restricted to private nets)
#
# Upstream addresses are resolved at REQUEST time through Docker's embedded
# DNS (127.0.0.11) via variables — an api/frontend container restart with a
# new IP keeps working instead of 502ing until an nginx reload.
#
# TLS: terminate here. Mount certs into /etc/nginx/certs and uncomment the
# 443 server block below (or put a managed LB/Caddy/Traefik in front).

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    # Real client IPs behind Docker networking
    set_real_ip_from 172.16.0.0/12;
    real_ip_header   X-Forwarded-For;

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent $request_time "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Compression — the dashboard ships large JSON payloads (audit, analytics)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml
        image/svg+xml font/woff2;

    # Per-IP API rate limit: generous for dashboards polling several widgets,
    # still stops a single misbehaving client from starving the rest.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80;
        server_name _;

        # Docker's embedded DNS; short TTL so container restarts are picked up.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $frontend_up http://frontend:3000;
        set $api_up      http://api:8000;

        client_max_body_size 50m;

        # Security headers for everything served through the proxy
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── Backend API (direct — no Next.js hop) ───────────────────────────
        location /api/backend/ {
            limit_req zone=api_limit burst=60 nodelay;
            # Frontend code calls /api/backend/<path>; serve it here directly
            # so the request skips the Next.js server entirely.
            rewrite ^/api/backend/(.*)$ /api/$1 break;
            proxy_pass $api_up;
            proxy_read_timeout  180s;   # job submission / long analytics queries
            proxy_send_timeout  180s;
        }

        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass $api_up;
            proxy_read_timeout  180s;
            proxy_send_timeout  180s;
        }

        location = /health       { proxy_pass $api_up; access_log off; }
        location = /docs         { proxy_pass $api_up; }
        location = /openapi.json { proxy_pass $api_up; }

        # Prometheus scrape — private networks only
        location = /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass $api_up;
            access_log off;
        }

        # ── Next.js static assets: content-hashed, cache forever ────────────
        location /_next/static/ {
            proxy_pass $frontend_up;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ── Everything else: Next.js SSR ─────────────────────────────────────
        location / {
            proxy_pass $frontend_up;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 60s;
        }
    }

    # ── HTTPS (enable when certs are mounted) ────────────────────────────────
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name your-domain.example;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     # …then copy the location blocks from the port-80 server above,
    #     # and reduce the port-80 server to a 301 redirect.
    # }
}
